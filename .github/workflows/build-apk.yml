name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Cancel older runs when a new push arrives (saves minutes on duplicate builds)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android SDK is pre-installed on ubuntu-latest runners
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Create stub for gitignored geminiKeys
        run: |
          if [ ! -f src/lib/geminiKeys.ts ]; then
            echo "export const GEMINI_API_KEYS: string[] = [];" > src/lib/geminiKeys.ts
          fi

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Gradle speed flags
        run: |
          printf '\norg.gradle.parallel=true\norg.gradle.caching=true\n' >> android/gradle.properties

      - name: Copy azan sounds to Android raw resources
        run: |
          mkdir -p android/app/src/main/res/raw
          # Remove any duplicates first (Android doesn't allow same name with different extensions)
          rm -f android/app/src/main/res/raw/azan.* android/app/src/main/res/raw/azan2.* android/app/src/main/res/raw/azan_makkah.*
          cp assets/audio/azan.ogg android/app/src/main/res/raw/azan.ogg
          cp assets/audio/azan2.ogg android/app/src/main/res/raw/azan2.ogg
          cp assets/audio/azan-makkah.mp3 android/app/src/main/res/raw/azan_makkah.mp3
          ls -lh android/app/src/main/res/raw/

      - name: Build APK (release, debug-signed standalone)
        run: |
          cd android
          chmod +x gradlew
          # Stable debug keystore for signing the TEST build (not for Play Store).
          # Using committed keystore so SHA-1 stays constant for Google Sign-In.
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Deen-v${VERSION}.apk
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deen-standalone-apk
          path: android/app/build/outputs/apk/release/Deen-v*.apk
