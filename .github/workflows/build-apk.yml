name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK is pre-installed on ubuntu-latest runners
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Create stub for gitignored geminiKeys
        run: |
          if [ ! -f src/lib/geminiKeys.ts ]; then
            echo "export const GEMINI_API_KEYS: string[] = [];" > src/lib/geminiKeys.ts
          fi

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (release, debug-signed standalone)
        run: |
          cd android
          chmod +x gradlew
          # Debug keystore for signing the TEST build (not for Play Store).
          keytool -genkeypair -v -keystore /tmp/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deen-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
